# Copie ce fichier en config.toml et adapte-le.
# Les secrets (tokens, clés) vont dans .env, JAMAIS ici.
# Format TOML : texte entre guillemets, true/false en minuscules, # = commentaire.

[x]
# Comptes X surveillés (nécessite X_BEARER_TOKEN dans .env, API payante).
# weight = importance (0 à 1). aliases = mots trop liés à l'auteur, pénalisés
# (sinon chaque token « trump » matcherait n'importe quel post de Trump).
poll_seconds = 20           # plus c'est bas, plus c'est réactif (et plus ça coûte en requêtes)
include_replies = false

[[x.accounts]]
username = "realDonaldTrump"
weight = 1.0
aliases = ["trump", "donald", "djt"]

[[x.accounts]]
username = "elonmusk"
weight = 0.9
aliases = ["elon", "musk"]

[[x.accounts]]
username = "cz_binance"
weight = 0.6
aliases = ["binance"]

[rss]
# Flux RSS gratuits. Trump poste surtout sur Truth Social : on utilise un miroir RSS
# (l'URL ci-dessous est un exemple, vérifie qu'elle marche avant de compter dessus).
poll_seconds = 60

[[rss.feeds]]
name = "Truth Social (Trump)"
url = "https://trumpstruth.org/feed"
weight = 1.0
aliases = ["trump", "donald"]

[[rss.feeds]]
name = "Google News - memecoin"
url = "https://news.google.com/rss/search?q=memecoin+OR+pump.fun&hl=en-US&gl=US&ceid=US:en"
weight = 0.4

[[rss.feeds]]
name = "BBC World"
url = "https://feeds.bbci.co.uk/news/world/rss.xml"
weight = 0.3

[telegram_channels]
# Chaînes Telegram publiques qui republient les tweets (Elon, Trump...). Gratuit.
# Nécessite TG_API_ID / TG_API_HASH dans .env + « python -m memebot telegram-login ».
# Le plus simple : ajoute les chaînes depuis Telegram avec /chaine @nom (pas besoin de toucher ici).
enabled = true
join = true                 # rejoint les chaînes (obligatoire pour recevoir les messages en direct)
session = "telegram"        # fichier telegram.session : NE LE PARTAGE JAMAIS

# Exemple (remplace par une vraie chaîne que tu as vérifiée) :
# [[telegram_channels.channels]]
# handle = "@nom_de_la_chaine"
# label = "Elon Musk (via Telegram)"
# weight = 0.9
# aliases = ["elon", "musk"]
# announce = false          # true = message Telegram à chaque post (spam si la chaîne poste beaucoup)

[narratives]
ttl_minutes = 45            # durée de vie d'un narratif (doublée si l'IA le juge très fort)
# Mots trop courants sur pump.fun : ils comptent beaucoup moins dans le matching.
generic_keywords = ["trump", "donald", "elon", "musk", "coin", "token", "sol", "solana",
                    "pump", "moon", "meme", "memecoin", "crypto", "bitcoin", "btc", "eth",
                    "official", "the", "inu", "usa", "america", "american", "president",
                    "news", "world", "people", "great", "today"]

[matching]
min_match_score = 0.55      # 0..1 — monte à 0.7 si tu reçois trop d'alertes
observe_seconds = 20        # temps d'observation des trades avant l'alerte (vitesse vs fiabilité)
retro_minutes = 10          # cherche aussi les tokens créés juste AVANT le post
max_watched_tokens = 60
max_alerts_per_narrative = 3

[alerts]
min_safety_to_alert = 40    # sous ce score de sécurité, pas d'alerte (0..100)
min_momentum = 10           # ignore les tokens que personne n'achète
show_dangerous = false      # true = alerte même les tokens 🔴 (pour apprendre)
watch_minutes = 30          # suivi après l'alerte (alerte si le dev vend) + bilan paper trading
rug_drop_alert_pct = 50     # alerte si la market cap chute de X % après l'alerte
notify_narrative_min_weight = 0.8   # annonce les posts des sources importantes
notify_narrative_min_hype = 60      # annonce les autres posts si l'IA les juge très « memeables »

[ai]
enabled = true              # nécessite ANTHROPIC_API_KEY dans .env (sinon ignoré)
model = "claude-opus-5-5"
effort = "low"              # low = réponse plus rapide, suffisant pour ce tri
min_hype = 25               # sous ce score, l'IA désactive le narratif (sauf /narratif manuel)
review_alerts = true        # l'IA ajoute un avis sous chaque alerte

[data]
# ipfs_gateway = "https://gateway.pinata.cloud"   # décommente si ipfs.io est lent
use_pumpfun_api = true      # API non officielle pump.fun (historique du créateur)
use_rugcheck = true
db_path = "memebot.db"
funding_check = true        # remonte d'où vient l'argent des premiers acheteurs (faux acheteurs)
funding_wallets = 8         # premiers acheteurs vérifiés par token (~3 requêtes RPC chacun)
funding_exchange_sol = 5000 # un financeur avec plus que ça = plateforme d'échange, ignoré
# ignore_funders = ["adresse1", "adresse2"]   # financeurs à ignorer (ex : un exchange précis)

[risk]
dev_buy_warn = 5            # % de la supply achetée par le dev au lancement
dev_buy_danger = 15
top10_warn = 30             # % détenu par le top 10 (hors bonding curve / pool)
top10_danger = 45
whale_warn = 8
whale_danger = 15
snipers_warn = 4            # wallets qui achètent dans les 2 premières secondes
snipers_danger = 8
serial_warn = 1             # autres tokens lancés par le même créateur en 24 h
serial_danger = 3
shared_funder_warn = 2      # premiers acheteurs financés par le même wallet
shared_funder_danger = 3
fresh_ratio_warn = 0.7      # part des premiers acheteurs qui sont des wallets tout neufs
creator_linked_critical = 3 # acheteurs financés par le créateur : à partir de 3, refus direct
rugger_critical = 2         # anciens tokens où le créateur a vidé ses parts : à partir de 2, refus direct
dead_tokens_warn = 3        # anciens tokens du créateur morts sans décoller

[recensement]
# Enregistre TOUS les nouveaux tokens et leur évolution (courbe relevée toutes les 15 s
# pendant 3 min, puis à 5, 15 et 30 min), pour les statistiques. Partage les lectures de
# la stratégie tendance : presque aucun crédit RPC en plus.
# Export : /export recensement 2 (les 2 derniers jours)
enabled = true
sample_pct = 100            # part des nouveaux tokens recensés
max_tracked = 3000
keep_days = 21              # conservation en base

[trending]
# Stratégie « tendance » : tokens qui décollent tout seuls, sans news (alertes 🔥).
# On/off à chaud depuis Telegram : /tendance on · /tendance off
# Les tokens sont observés en lisant leur bonding curve en groupe (peu de crédits RPC).
enabled = true
window_seconds = 180        # observe chaque nouveau token pendant ses 3 premières minutes
min_age_seconds = 30        # jamais avant 30 s (les faux acheteurs achètent dès la 1re seconde)
min_buy_sol = 4.0           # SOL entrés dans la courbe, hors achat du dev
min_progress_pct = 10       # avancement de la bonding curve
poll_seconds = 15           # lecture des courbes toutes les 15 s (1 requête pour 100 tokens)
max_checks_per_hour = 6     # analyses complètes max par heure (économise ta clé Helius)
max_probes = 100            # tokens observés en même temps
trade = false               # le trader n'achète pas ces tokens (/tendance achats on pour tester)

[trading]
# "off"   = pas de trading automatique
# "paper" = argent VIRTUEL (par défaut) : teste au moins 2 semaines avant de passer en réel
# "live"  = VRAI argent (nécessite WALLET_PRIVATE_KEY d'un wallet DÉDIÉ dans .env)
mode = "paper"
paper_start_sol = 0.05      # capital virtuel (~7 $)

# Taille des positions
reserve_sol = 0.008         # jamais tradé : frais réseau + loyer du compte token
position_pct = 0.35         # part du capital disponible par trade
min_position_sol = 0.005    # en dessous, les frais mangent tout : le bot s'arrête
max_position_sol = 0.5
max_open_positions = 1

# Filtres d'entrée (plus stricts que les alertes)
min_safety = 60
min_momentum = 30
max_entry_mcap_sol = 50     # n'achète pas un token déjà trop monté
max_entry_age_seconds = 90
max_dev_buy_pct = 5         # refuse si le dev détient 5 % ou plus
max_top10_pct = 30          # refuse si le top 10 des holders détient 30 % ou plus

# Sorties
stop_loss_pct = 25
take_profit_pct = 100       # à x2...
take_profit_fraction = 0.5  # ...vend la moitié (la mise est récupérée)
trailing_arm_pct = 40       # trailing stop actif à partir de +40 %...
trailing_stop_pct = 30      # ...vend tout si -30 % depuis le plus haut
time_stop_minutes = 15      # vend si moins de +10 % après 15 min
time_stop_min_gain_pct = 10
stale_minutes = 5           # vend si plus aucun échange

# Après x2 : la mise est récupérée, le reste (« moonbag ») peut courir
take_profit2_pct = 400      # à x5... (0 = pas de 2e palier)
take_profit2_fraction = 0.5 # ...vend la moitié de ce qui reste
moonbag_trailing_pct = 45   # vend le reste si -45 % depuis le plus haut
reversal_window_seconds = 60  # vend si, sur la dernière minute...
reversal_sell_ratio = 2.0     # ...les ventes font 2x les achats...
reversal_min_sell_sol = 1.0   # ...(au moins 1 SOL vendu)...
reversal_drop_pct = 20        # ...et le prix est 20 % sous son plus haut (0 sur la fenêtre = désactivé)
moonbag_stale_minutes = 60  # vend si plus aucun échange pendant 1 h
moonbag_max_hours = 72      # durée maximale de garde (0 = illimitée)
max_moonbags = 3            # moonbags qui ne bloquent pas les nouveaux achats
after_watch_minutes = 120   # après chaque vente, suit encore le prix 2 h (/sorties)

# Coupe-circuits
daily_loss_limit_pct = 35   # plus d'achat aujourd'hui si -35 % depuis minuit (UTC)
max_drawdown_pct = 60       # arrêt complet si -60 % depuis le plus haut (/trading on pour relancer)
max_consecutive_losses = 3
cooldown_minutes = 120

# Exécution (mode réel)
slippage_pct = 15
priority_fee_sol = 0.0003
wallet_max_balance_sol = 0.5  # refuse de trader si le wallet contient plus (protège ton wallet principal)

# Simulation (mode papier)
fee_pct = 1.75              # frais estimés par ordre : ~1,25 % pump.fun + 0,5 % PumpPortal
tx_fee_sol = 0.0003
paper_latency_seconds = 2.0
